<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AHAD · SECURE DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
                   ROOT & RESET
                ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #06060e;
            --bg-secondary: #0b0b18;
            --bg-card: #0f0f22;
            --bg-input: #080814;
            --bg-hover: #161638;
            --border-color: #181840;
            --border-light: #282860;
            --border-active: #6c7cff;
            --text-primary: #ededf5;
            --text-secondary: #8888cc;
            --text-muted: #555588;
            --accent: #6c7cff;
            --accent-glow: rgba(108, 124, 255, 0.25);
            --accent-hover: #8a9aff;
            --shadow-card: 0 20px 80px rgba(0, 0, 0, 0.8);
            --shadow-glow: 0 0 80px rgba(108, 124, 255, 0.06);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        [data-theme="light"] {
            --bg-primary: #eceef8;
            --bg-secondary: #e0e2f0;
            --bg-card: #ffffff;
            --bg-input: #f4f6fe;
            --bg-hover: #e8eaf6;
            --border-color: #c8cce0;
            --border-light: #d8dcee;
            --border-active: #6c7cff;
            --text-primary: #12122a;
            --text-secondary: #555588;
            --text-muted: #8888bb;
            --accent: #6c7cff;
            --accent-glow: rgba(108, 124, 255, 0.12);
            --accent-hover: #5a6cf0;
            --shadow-card: 0 20px 80px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 80px rgba(108, 124, 255, 0.03);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.4s ease;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
                   SCROLLBAR
                ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
            box-shadow: 0 0 30px var(--accent-glow);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
                   CONTAINER
                ============================================================ */
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            flex: 1;
        }

        /* ============================================================
                   HEADER
                ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0 22px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 16px;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.4;
            filter: blur(3px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            color: #fff;
            letter-spacing: -0.5px;
            box-shadow: 0 0 50px var(--accent-glow), inset 0 0 30px rgba(255, 255, 255, 0.06);
            transition: var(--transition);
        }
        .logo-icon:hover {
            box-shadow: 0 0 80px var(--accent-glow), inset 0 0 40px rgba(255, 255, 255, 0.1);
            transform: scale(1.04);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }
        .header h1 span {
            color: var(--accent);
            text-shadow: 0 0 40px var(--accent-glow);
        }

        .header-sub {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 600;
            color: #34d399;
            background: rgba(52, 211, 153, 0.06);
            padding: 6px 18px;
            border-radius: 30px;
            border: 1px solid rgba(52, 211, 153, 0.10);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.02);
        }
        .status-badge .dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse-dot 2s infinite;
            box-shadow: 0 0 16px #34d399;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* ============================================================
                   THEME TOGGLE — NEON ELITE
                ============================================================ */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 6px 8px 6px 18px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            box-shadow: 0 0 40px rgba(108, 124, 255, 0.02);
        }
        .theme-toggle:hover {
            border-color: var(--border-active);
            box-shadow: 0 0 60px var(--accent-glow);
            background: var(--bg-hover);
            transform: scale(1.02);
        }
        .theme-toggle .label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        .toggle-track {
            width: 44px;
            height: 24px;
            background: var(--border-color);
            border-radius: 30px;
            position: relative;
            transition: var(--transition);
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.4);
        }
        .toggle-track .thumb {
            width: 18px;
            height: 18px;
            background: var(--text-primary);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: var(--transition);
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
        }
        [data-theme="dark"] .toggle-track .thumb {
            transform: translateX(20px);
            background: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        [data-theme="dark"] .toggle-track {
            background: var(--accent);
            opacity: 0.35;
            box-shadow: inset 0 0 16px var(--accent-glow);
        }

        /* ============================================================
                   MAIN CARD — GLASS + NEON BORDER
                ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px;
            margin-top: 34px;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: var(--radius);
            padding: 1.5px;
            background: linear-gradient(135deg, transparent 25%, var(--accent) 50%, transparent 75%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.12;
            pointer-events: none;
            transition: var(--transition);
        }
        .card:hover::before {
            opacity: 0.3;
        }
        .card:hover {
            border-color: var(--border-light);
            box-shadow: var(--shadow-card), 0 0 100px var(--accent-glow);
        }

        /* ============================================================
                   SEARCH
                ============================================================ */
        .search-section {
            margin-bottom: 8px;
        }

        .search-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: block;
            letter-spacing: 0.5px;
        }
        .search-label code {
            background: var(--bg-secondary);
            padding: 2px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font);
            border: 1px solid var(--border-color);
        }

        .search-row {
            display: flex;
            gap: 14px;
            align-items: stretch;
            flex-wrap: wrap;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 15px;
            font-family: var(--font);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            font-weight: 400;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.2);
        }
        .search-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }
        .search-input:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 5px var(--accent-glow), inset 0 0 40px rgba(0, 0, 0, 0.2);
            transform: scale(1.005);
        }

        .search-btn {
            padding: 18px 38px;
            font-family: var(--font);
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            letter-spacing: 0.5px;
            box-shadow: 0 0 50px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }
        .search-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .search-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.05) 100%);
            pointer-events: none;
        }
        .search-btn:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 60px var(--accent-glow);
        }
        .search-btn:active {
            transform: translateY(0) scale(0.98);
        }
        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .search-btn svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.05);
            color: #ef4444;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            margin-top: 16px;
            border: 1px solid rgba(239, 68, 68, 0.10);
            display: none;
            font-size: 14px;
            font-weight: 400;
        }
        .error-message.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
                   RESULTS
                ============================================================ */
        .results-section {
            margin-top: 30px;
            display: none;
        }
        .results-section.active {
            display: block;
            animation: fadeSlide 0.5s ease;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 22px;
        }

        .results-count {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .results-count strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .results-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .cached-badge {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(108, 124, 255, 0.03);
        }

        .copy-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .copy-btn:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background: var(--bg-hover);
            box-shadow: 0 0 40px var(--accent-glow);
            transform: translateY(-1px);
        }
        .copy-btn.copied {
            border-color: #34d399;
            color: #34d399;
            background: rgba(52, 211, 153, 0.05);
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.05);
        }
        .copy-btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ============================================================
                   TABLE — NEON ACCENTS
                ============================================================ */
        .table-wrapper {
            overflow-x: auto;
            display: block;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.08);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
            font-size: 14px;
        }
        .results-table th {
            text-align: left;
            padding: 16px 20px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .results-table td {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: top;
        }
        .results-table tr:last-child td {
            border-bottom: none;
        }
        .results-table tr:hover td {
            background: var(--bg-hover);
        }
        .results-table tr:hover .phone-cell {
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .phone-cell {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            font-family: 'SF Mono', 'Inter', monospace;
            letter-spacing: 0.3px;
            transition: var(--transition);
        }
        .cnic-cell {
            font-family: 'SF Mono', 'Inter', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .address-cell {
            color: var(--text-secondary);
            max-width: 280px;
            line-height: 1.6;
        }
        .name-cell {
            font-weight: 500;
        }

        /* ============================================================
                   MOBILE CARDS — NEON GLOW ON HOVER
                ============================================================ */
        .mobile-results {
            display: none;
        }

        .result-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 20px 22px;
            margin-bottom: 14px;
            transition: var(--transition);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.04);
        }
        .result-card:hover {
            border-color: var(--border-active);
            background: var(--bg-hover);
            box-shadow: 0 0 50px var(--accent-glow), inset 0 0 30px rgba(0, 0, 0, 0.04);
            transform: translateY(-3px);
        }
        .result-card:last-child {
            margin-bottom: 0;
        }

        .result-card-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .result-card-row:last-child {
            border-bottom: none;
        }
        .result-card-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 70px;
        }
        .result-card-value {
            font-size: 14px;
            color: var(--text-primary);
            text-align: right;
            word-break: break-word;
            flex: 1;
        }
        .result-card-value.phone {
            font-weight: 600;
            font-family: 'SF Mono', 'Inter', monospace;
        }
        .result-card-value.cnic {
            font-family: 'SF Mono', 'Inter', monospace;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .result-card-value.address {
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .result-card-value.na {
            color: var(--text-muted);
            font-style: italic;
        }

        .no-results {
            text-align: center;
            padding: 70px 20px;
            color: var(--text-secondary);
        }
        .no-results .icon {
            font-size: 52px;
            margin-bottom: 18px;
            opacity: 0.3;
        }
        .no-results p {
            font-size: 15px;
        }

        /* ============================================================
                   FOOTER
                ============================================================ */
        .footer {
            margin-top: 55px;
            border-top: 1px solid var(--border-color);
            padding: 36px 24px;
            background: var(--bg-secondary);
            position: relative;
        }
        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.12;
            filter: blur(3px);
        }

        .footer-content {
            max-width: 1120px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .footer-brand .logo-small {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            box-shadow: 0 0 40px var(--accent-glow);
        }
        .footer-brand .name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        .footer-brand .name span {
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-links a:hover {
            color: var(--text-primary);
            text-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-1px);
        }
        .footer-links a svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .footer-copy {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* ============================================================
                   TOAST — NEON
                ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--border-active);
            color: var(--text-primary);
            padding: 16px 32px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            box-shadow: var(--shadow-card), 0 0 80px var(--accent-glow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast .check {
            color: #34d399;
            margin-right: 10px;
            text-shadow: 0 0 30px #34d399;
        }

        /* ============================================================
                   RESPONSIVE
                ============================================================ */
        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }
            .card {
                padding: 26px 20px;
                border-radius: 16px;
                margin-top: 22px;
            }
            .header {
                padding: 22px 0 18px;
            }
            .header h1 {
                font-size: 19px;
            }
            .logo-icon {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }
            .header-sub {
                font-size: 12px;
            }
            .status-badge {
                font-size: 10px;
                padding: 4px 14px;
            }
            .theme-toggle .label {
                display: none;
            }
            .theme-toggle {
                padding: 6px 8px;
            }

            .search-row {
                flex-direction: column;
            }
            .search-btn {
                justify-content: center;
                padding: 16px 24px;
            }

            .table-wrapper {
                display: none;
            }
            .mobile-results {
                display: block;
            }

            .results-header {
                flex-direction: column;
                align-items: stretch;
            }
            .results-actions {
                justify-content: space-between;
            }

            .footer-links {
                gap: 16px;
            }
            .footer-links a {
                font-size: 12px;
            }

            .toast {
                white-space: normal;
                width: calc(100% - 32px);
                text-align: center;
                padding: 14px 20px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 17px;
            }
            .logo-icon {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
            .search-input {
                padding: 14px 18px;
                font-size: 14px;
            }
            .search-btn {
                font-size: 13px;
                padding: 14px 20px;
            }
            .card {
                padding: 18px 14px;
            }
            .result-card {
                padding: 16px 16px;
            }
            .result-card-value {
                font-size: 13px;
            }
            .result-card-label {
                font-size: 9px;
                min-width: 60px;
            }
        }

        /* ============================================================
                   LOADING SPINNER — NEON
                ============================================================ */
        .spinner {
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.10);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.04);
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        [data-theme="light"] .spinner {
            border-color: rgba(0, 0, 0, 0.06);
            border-top-color: var(--accent);
        }
        /* custom msgbox overlay */
        .msg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .msg-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .msg-box {
            background: var(--bg-card);
            border: 1px solid var(--border-active);
            border-radius: var(--radius);
            padding: 40px 48px;
            max-width: 440px;
            width: 90%;
            box-shadow: 0 0 120px var(--accent-glow);
            text-align: center;
            transform: scale(0.95);
            transition: transform 0.4s ease;
        }
        .msg-overlay.active .msg-box {
            transform: scale(1);
        }
        .msg-box h2 {
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 60px var(--accent-glow);
            margin-bottom: 8px;
        }
        .msg-box p {
            color: var(--text-secondary);
            font-size: 16px;
            margin: 8px 0 20px;
            line-height: 1.5;
        }
        .msg-box .sub {
            color: var(--text-muted);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            padding-top: 18px;
            margin-top: 8px;
        }
        .msg-box .close-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .msg-box .close-btn:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background: var(--bg-hover);
            box-shadow: 0 0 40px var(--accent-glow);
        }
        /* override for phone/cnic special */
        .special-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

                        <span class="cached-badge" id="cachedBadge" style="display:none;">⚡ cached</span>
                        <button class="copy-btn" id="copyBtn" onclick="copyResults()">

        </main>
    </div>

    <!-- ==========================================================

            <div class="footer-brand">
                <div class="logo-small">A</div>
                <span class="name">AHAD <span>·</span> SECURE</span>
            </div>
            <div class="footer-links">

                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 0 0-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>

                    <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>

    <!-- ==========================================================
    TOAST
    ========================================================== -->
    <div class="toast" id="toast"><span class="check">✓</span> Copied to clipboard</div>

    <!-- ==========================================================
    MSGBOX OVERLAY (AHAD is your Father)
    ========================================================== -->
    <div class="msg-overlay" id="msgOverlay">
        <div class="msg-box">
            <h2>👑 AHAD</h2>
            <p>is your Father.</p>
            <div class="sub">— secure lineage —</div>
            <button class="close-btn" onclick="closeMsg()">✕ close</button>
        </div>
    </div>

    <!-- ==========================================================
    SCRIPTS
    ========================================================== -->
    <script>
        // ------------------------------------------------------------
        // DOM refs
        // ------------------------------------------------------------
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsSection = document.getElementById('resultsSection');
        const desktopResults = document.getElementById('desktopResults');
        const mobileResults = document.getElementById('mobileResults');
        const resultsCount = document.getElementById('resultsCount');
        const cachedBadge = document.getElementById('cachedBadge');
        const errorMessage = document.getElementById('errorMessage');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const themeLabel = document.getElementById('themeLabel');

        let currentResults = [];

        // ------------------------------------------------------------
        // Theme
        // ------------------------------------------------------------
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeLabel.textContent = next === 'dark' ? 'Dark' : 'Light';
        }

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeLabel.textContent = savedTheme === 'dark' ? 'Dark' : 'Light';

        // ------------------------------------------------------------
        // Enter key
        // ------------------------------------------------------------
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // ------------------------------------------------------------
        // Helpers
        // ------------------------------------------------------------
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('active');
            setTimeout(() => errorMessage.classList.remove('active'), 5000);
        }

        function showToast(msg) {
            toast.innerHTML = `<span class="check">✓</span> ${msg}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function setLoading(loading) {
            if (loading) {
                searchBtn.disabled = true;
                searchBtn.innerHTML = `<div class="spinner"></div> Searching...`;
            } else {
                searchBtn.disabled = false;
                searchBtn.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.35-4.35" />
                            </svg>
                            Search
                        `;
            }
        }

        function formatCNIC(c) {
            if (c && c.length === 13) {
                return `${c.slice(0, 5)}-${c.slice(5, 12)}-${c.slice(12)}`;
            }
            return c || '-';
        }

        function cleanAddress(a) {
            if (!a) return 'no';
            return a
                .replace(/&quot;/g, '"')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .replace(/^"|"$/g, '')
                .trim();
        }

        // ------------------------------------------------------------
        // Search
        // ------------------------------------------------------------
        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                showError('Please enter a phone number or CNIC');
                return;
            }

            // ---- SPECIAL NUMBER HANDLING: show msgbox, no API ----
            if (query === '4220159449633' || query === '03162027434') {
                showMsgBox();
                // clear results and hide section
                resultsSection.classList.remove('active');
                currentResults = [];
                return;
            }

            errorMessage.classList.remove('active');
            resultsSection.classList.remove('active');
            setLoading(true);

            try {
                const response = await fetch(
                    `https://sim-db-api.faizankhichi.me/?search=${encodeURIComponent(query)}`
                );
                const data = await response.json();
                if (!data.ok) throw new Error('API request failed');
                currentResults = data.data || [];
                displayResults(data);
            } catch (err) {
                showError('Failed to fetch data. Please try again.');
                console.error('Search error:', err);
            } finally {
                setLoading(false);
            }
        }

        // ------------------------------------------------------------
        // Display
        // ------------------------------------------------------------
        function displayResults(data) {
            const records = data.data || [];

            if (records.length === 0) {
                const empty = `
                            <div class="no-results">
                                <div class="icon">🔍</div>
                                <p>No records found for this search</p>
                            </div>
                        `;
                desktopResults.innerHTML = empty;
                mobileResults.innerHTML = empty;
            } else {
                // ---- Desktop table ----
                let tableHtml = `
                            <table class="results-table">
                                <thead>
                                    <tr>
                                        <th>Phone</th>
                                        <th>Name</th>
                                        <th>CNIC</th>
                                        <th>Address</th>
                                    </tr>
                                </thead>
                                <tbody>
                        `;
                records.forEach((r) => {
                    const addr = cleanAddress(r.adr || 'no');
                    const displayAddr = addr === 'no' ?
                        '<span style="color:var(--text-muted);font-style:italic;">N/A</span>' :
                        addr;
                    tableHtml += `
                                <tr>
                                    <td class="phone-cell">${r.nbr || '-'}</td>
                                    <td class="name-cell">${r.nam || '-'}</td>
                                    <td class="cnic-cell">${formatCNIC(r.cni)}</td>
                                    <td class="address-cell">${displayAddr}</td>
                                </tr>
                            `;
                });
                tableHtml += '</tbody></table>';
                desktopResults.innerHTML = tableHtml;

                // ---- Mobile cards ----
                let cardsHtml = '';
                records.forEach((r) => {
                    const addr = cleanAddress(r.adr || 'no');
                    const addressVal = addr === 'no' ?
                        '<span class="na">N/A</span>' :
                        addr;
                    cardsHtml += `
                                <div class="result-card">
                                    <div class="result-card-row">
                                        <span class="result-card-label">Phone</span>
                                        <span class="result-card-value phone">${r.nbr || '-'}</span>
                                    </div>
                                    <div class="result-card-row">
                                        <span class="result-card-label">Name</span>
                                        <span class="result-card-value">${r.nam || '-'}</span>
                                    </div>
                                    <div class="result-card-row">
                                        <span class="result-card-label">CNIC</span>
                                        <span class="result-card-value cnic">${formatCNIC(r.cni)}</span>
                                    </div>
                                    <div class="result-card-row">
                                        <span class="result-card-label">Address</span>
                                        <span class="result-card-value address">${addressVal}</span>
                                    </div>
                                </div>
                            `;
                });
                mobileResults.innerHTML = cardsHtml;
            }

            resultsCount.innerHTML =
                `Found <strong>${records.length}</strong> record${records.length !== 1 ? 's' : ''}`;
            cachedBadge.style.display = data.cached === 'yes' ? 'inline-block' : 'none';
            resultsSection.classList.add('active');
        }

        // ------------------------------------------------------------
        // Copy
        // ------------------------------------------------------------
        function copyResults() {
            if (currentResults.length === 0) {
                showToast('No results to copy');
                return;
            }

            const query = searchInput.value.trim();
            const timestamp = new Date().toLocaleString();

            let text = `╔══════════════════════════════════════════════════════╗\n`;
            text += `║          AHAD SECURE DB — SEARCH OUTPUT           ║\n`;
            text += `╠══════════════════════════════════════════════════════╣\n`;
            text += `║  Query : ${query.padEnd(45)} ║\n`;
            text += `║  Date  : ${timestamp.padEnd(51)} ║\n`;
            text += `║  Hits  : ${String(currentResults.length).padEnd(42)} ║\n`;
            text += `╠══════════════════════════════════════════════════════╣\n`;

            currentResults.forEach((r, i) => {
                const addr = cleanAddress(r.adr || 'no') === 'no' ? 'N/A' : cleanAddress(r.adr || 'no');
                text += `║  #${i + 1}                                                    ║\n`;
                text += `║  📱 ${(r.nbr || '-').padEnd(45)} ║\n`;
                text += `║  👤 ${(r.nam || '-').padEnd(45)} ║\n`;
                text += `║  🆔 ${(formatCNIC(r.cni) || '-').padEnd(45)} ║\n`;
                text += `║  📍 ${addr.substring(0, 45).padEnd(45)} ║\n`;
                text += `║  ${'─'.repeat(52)}  ║\n`;
            });

            text += `╠══════════════════════════════════════════════════════╣\n`;
            text += `║  🔐 AHAD · Secure Database Interface                ║\n`;
            text += `╚══════════════════════════════════════════════════════╝`;

            navigator.clipboard.writeText(text).then(() => {
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12" />
                            </svg>
                            Copied!
                        `;
                showToast('Copied to clipboard');

                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = `
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                                </svg>
                                Copy
                            `;
                }, 2000);
            }).catch(() => {
                showToast('Failed to copy');
            });
        }

        // ------------------------------------------------------------
        // CUSTOM: show/hide msgbox
        // ------------------------------------------------------------
        function showMsgBox() {
            document.getElementById('msgOverlay').classList.add('active');
        }
        function closeMsg() {
            document.getElementById('msgOverlay').classList.remove('active');
        }

        // close msgbox on overlay click (not on box click)
        document.getElementById('msgOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeMsg();
        });

        // re-bind search to use the overridden performSearch
        searchBtn.onclick = performSearch;
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        console.log('✅ AHAD DB ready — special numbers show "Ahad is your Father"');
    </script>

</body>
